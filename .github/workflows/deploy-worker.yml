name: CI
on:
  push:
    branches:
      - master
      - main
    paths:
      - "worker/**"
      - "frontend/**"
      - "test/**"
      - "scripts/**"
      - ".github/scripts/**"
      - ".github/workflows/deploy-worker.yml"
      - "package.json"
      - "package-lock.json"
      - "biome.json"
      - "rrangler.json"
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build RandallFlare worker bundle
        run: npm run build:rf
      - name: Guard against Cloudflare wrangler delivery
        run: node -e "const p=require('./package.json'); if (/\bwrangler\b/.test(String(p.scripts.deploy||''))) { console.error('deploy must use rrangler'); process.exit(1); }"
